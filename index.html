<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Acquire</title>
    <meta
      name="description"
      content="A chronological record of acquisitions."
    />
    <style>
      :root {
        --background: #ffffff;
        --text: rgba(0, 0, 0, 0.88);
        --text-strong: #000000;
        --muted: rgba(0, 0, 0, 0.55);
        --faint: rgba(0, 0, 0, 0.35);
        --line: rgba(0, 0, 0, 0.12);
        --line-soft: rgba(0, 0, 0, 0.07);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }

      main {
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 72px 48px 56px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 48px;
      }

      h1 {
        margin: 0;
        color: var(--text-strong);
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      .description,
      #status {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      #status {
        margin: 0;
        text-align: right;
        white-space: nowrap;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        padding: 18px 14px;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child {
        padding-left: 0;
      }

      th:last-child,
      td:last-child {
        padding-right: 0;
      }

      th {
        border-bottom: 1px solid var(--line);
        color: var(--faint);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .sort-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
        text-align: inherit;
        text-transform: inherit;
        cursor: pointer;
      }

      .sort-button::after {
        color: var(--faint);
        content: "↕";
        font-size: 13px;
        line-height: 1;
      }

      .sort-button[aria-sort="ascending"]::after {
        color: var(--text-strong);
        content: "↑";
      }

      .sort-button[aria-sort="descending"]::after {
        color: var(--text-strong);
        content: "↓";
      }

      .sort-button:focus-visible {
        outline: 2px solid rgba(0, 0, 0, 0.55);
        outline-offset: 3px;
      }

      tbody tr {
        border-top: 1px solid var(--line-soft);
      }

      .date {
        color: var(--muted);
      }

      .name {
        color: var(--text-strong);
        font-weight: 600;
      }

      .state {
        width: 26px;
        padding-right: 0;
      }

      .flag {
        display: block;
        width: 16px;
        height: 16px;
        object-fit: contain;
      }

      .price {
        text-align: right;
      }

      .empty,
      .error {
        padding: 56px 0;
        color: var(--muted);
        text-align: center;
      }

      .site-footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 680px) {
        main {
          padding: 40px 20px 32px;
        }

        header {
          align-items: start;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 32px;
        }

        #status {
          text-align: left;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Acquire</h1>
          <p class="description">
            A chronological record of company acquisitions.
          </p>
        </div>
        <p id="status" aria-live="polite">Loading data…</p>
      </header>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">
                <button
                  class="sort-button"
                  type="button"
                  data-sort-key="date"
                  aria-sort="descending"
                >
                  Date
                </button>
              </th>
              <th scope="col" aria-label="Initiator country or region"></th>
              <th scope="col">Initiator</th>
              <th
                scope="col"
                aria-label="Acquired company country or region"
              ></th>
              <th scope="col">Acquired</th>
              <th scope="col" class="price">
                <button
                  class="sort-button"
                  type="button"
                  data-sort-key="price"
                  aria-sort="none"
                >
                  Price
                </button>
              </th>
              <th scope="col" class="info"></th>
            </tr>
          </thead>
          <tbody id="acquisition-list"></tbody>
        </table>
      </div>

      <footer class="site-footer">
        Click Date or Price to change the sort order.
      </footer>
    </main>

    <script>
      const listNode = document.querySelector("#acquisition-list");
      const statusNode = document.querySelector("#status");
      const sortButtons = document.querySelectorAll(".sort-button");
      const flagBaseUrl = "//cdn.1htr.cn/static/image/flags/small/";
      let acquisitions = [];
      let sortState = { key: "date", direction: "desc" };

      const parseDate = (value) => {
        const match = /^(\d{2})\/(\d{2})\/(\d{2})$/.exec(String(value));
        if (!match) return Number.NEGATIVE_INFINITY;
        const [, year, month, day] = match;
        return Date.UTC(2000 + Number(year), Number(month) - 1, Number(day));
      };

      const parsePrice = (value) => {
        const parsed = Number(String(value).replaceAll(",", ""));
        return Number.isFinite(parsed) ? parsed : Number.NEGATIVE_INFINITY;
      };

      const getSortValue = (item) =>
        sortState.key === "date"
          ? parseDate(item.date)
          : parsePrice(item.price);

      const getSortedItems = () => {
        const direction = sortState.direction === "asc" ? 1 : -1;
        return [...acquisitions].sort(
          (left, right) =>
            (getSortValue(left) - getSortValue(right)) * direction,
        );
      };

      const updateSortButtons = () => {
        sortButtons.forEach((button) => {
          const direction =
            button.dataset.sortKey === sortState.key
              ? sortState.direction
              : "none";
          button.setAttribute(
            "aria-sort",
            direction === "asc"
              ? "ascending"
              : direction === "desc"
                ? "descending"
                : "none",
          );
        });
      };

      const appendTextCell = (row, text, className = "") => {
        const cell = document.createElement("td");
        cell.textContent = text || "-";
        if (className) cell.className = className;
        row.append(cell);
      };

      const appendPriceCell = (row, price, unit, className = "") => {
        const cell = document.createElement("td");
        cell.innerHTML = `${price} <i style="opacity: 0.5">${unit}</i>`;
        if (className) cell.className = className;
        row.append(cell);
      };

      const appendStateCell = (row, state) => {
        const cell = document.createElement("td");
        cell.className = "state";
        const image = document.createElement("img");
        image.className = "flag";
        const stateCode = { usa: "united-states-of-america" }[state] || state;
        image.src = `${flagBaseUrl}${stateCode}.png`;
        image.alt = "";
        image.setAttribute("aria-hidden", "true");
        image.width = 16;
        image.height = 16;
        cell.append(image);
        row.append(cell);
      };

      const appendLinkCell = (row, link) => {
        const cell = document.createElement("td");
        cell.className = "link";
        if (link) {
          const anchor = document.createElement("a");
          anchor.href = link;
          anchor.textContent = "Info";
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          cell.append(anchor);
        } else {
          cell.textContent = "-";
        }
        row.append(cell);
      };

      const showMessage = (message, className) => {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 7;
        cell.className = className;
        cell.textContent = message;
        row.append(cell);
        listNode.replaceChildren(row);
      };

      const render = () => {
        const sortedItems = getSortedItems();
        updateSortButtons();
        if (!sortedItems.length) {
          showMessage("No acquisition records are available.", "empty");
          statusNode.textContent = "No records";
          return;
        }

        const fragment = document.createDocumentFragment();
        sortedItems.forEach((item) => {
          const row = document.createElement("tr");
          appendTextCell(row, item.date, "date");
          appendStateCell(row, item.initiatorState || "other");
          appendTextCell(row, item.initiator, "name");
          appendStateCell(row, item.acquiredState || "other");
          appendTextCell(row, item.acquired, "name");
          appendPriceCell(row, item.price, item.unit, "price");
          appendLinkCell(row, item.officialInfo);
          fragment.append(row);
        });
        listNode.replaceChildren(fragment);
        statusNode.textContent = `${sortedItems.length} records`;
      };

      sortButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.sortKey;
          const direction =
            sortState.key === key && sortState.direction === "desc"
              ? "asc"
              : "desc";
          sortState = { key, direction };
          render();
        });
      });

      fetch("./data.json")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((data) => {
          if (!Array.isArray(data.list)) throw new Error("Invalid data format");
          acquisitions = data.list;
          render();
        })
        .catch((error) => {
          console.error("Unable to load data.json:", error);
          showMessage(
            "Unable to load data. Please open this page through an HTTP server.",
            "error",
          );
          statusNode.textContent = "Failed to load data";
        });
    </script>
  </body>
</html>
