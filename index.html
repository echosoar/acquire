<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Acquire</title>
    <meta name="description" content="A chronological record of acquisitions." />
    <style>
      :root {
        --background: #ffffff;
        --text: rgba(0, 0, 0, 0.88);
        --text-strong: #000000;
        --muted: rgba(0, 0, 0, 0.55);
        --faint: rgba(0, 0, 0, 0.35);
        --line: rgba(0, 0, 0, 0.12);
        --line-soft: rgba(0, 0, 0, 0.07);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 1440px);
        margin: 0 auto;
        padding: 72px 48px 56px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 48px;
      }

      h1 {
        margin: 0;
        color: var(--text-strong);
        font-size: 32px;
        font-weight: 650;
        letter-spacing: -0.03em;
      }

      .description,
      #status {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      #status {
        margin: 0;
        text-align: right;
        white-space: nowrap;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        padding: 18px 14px;
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child {
        padding-left: 0;
      }

      th:last-child,
      td:last-child {
        padding-right: 0;
      }

      th {
        border-bottom: 1px solid var(--line);
        color: var(--faint);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      tbody tr {
        border-top: 1px solid var(--line-soft);
      }

      .date {
        color: var(--muted);
      }

      .name {
        color: var(--text-strong);
        font-weight: 600;
      }

      .state {
        width: 26px;
        padding-right: 0;
      }

      .flag {
        display: block;
        width: 16px;
        height: 16px;
        object-fit: contain;
      }

      .price {
        text-align: right;
      }

      .empty,
      .error {
        padding: 56px 0;
        color: var(--muted);
        text-align: center;
      }

      .site-footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--line-soft);
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 680px) {
        main {
          padding: 40px 20px 32px;
        }

        header {
          align-items: start;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 32px;
        }

        #status {
          text-align: left;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Acquire</h1>
          <p class="description">A chronological record of company acquisitions.</p>
        </div>
        <p id="status" aria-live="polite">Loading data…</p>
      </header>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col" aria-label="Initiator country or region"></th>
              <th scope="col">Initiator</th>
              <th scope="col" aria-label="Acquired company country or region"></th>
              <th scope="col">Acquired</th>
              <th scope="col" class="price">Price</th>
              <th scope="col" class="info"></th>
            </tr>
          </thead>
          <tbody id="acquisition-list"></tbody>
        </table>
      </div>

      <footer class="site-footer">Data is ordered from newest to oldest.</footer>
    </main>

    <script>
      const listNode = document.querySelector('#acquisition-list');
      const statusNode = document.querySelector('#status');
      const flagBaseUrl = '//cdn.1htr.cn/static/image/flags/small/';

      const parseDate = (value) => {
        const match = /^(\d{2})\/(\d{2})\/(\d{2})$/.exec(String(value));
        if (!match) return Number.NEGATIVE_INFINITY;
        const [, year, month, day] = match;
        return Date.UTC(2000 + Number(year), Number(month) - 1, Number(day));
      };

      const appendTextCell = (row, text, className = '') => {
        const cell = document.createElement('td');
        cell.textContent = text || '-';
        if (className) cell.className = className;
        row.append(cell);
      };

      const appendStateCell = (row, state) => {
        const cell = document.createElement('td');
        cell.className = 'state';
        const image = document.createElement('img');
        image.className = 'flag';
        image.src = `${flagBaseUrl}${{
          usa: 'united-states-of-america',
        }[state] || state}.png`;
        image.alt = '';
        image.setAttribute('aria-hidden', 'true');
        image.width = 16;
        image.height = 16;
        cell.append(image);
        row.append(cell);
      };

      const appendLinkCell = (row, link) => {
        const cell = document.createElement('td');
        cell.className = 'link';
        if (link) {
          const anchor = document.createElement('a');
          anchor.href = link;
          anchor.textContent = 'Info';
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          cell.append(anchor);
        } else {
          cell.textContent = '-';
        }
        row.append(cell);
      };

      const showMessage = (message, className) => {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 6;
        cell.className = className;
        cell.textContent = message;
        row.append(cell);
        listNode.replaceChildren(row);
      };

      const render = (items) => {
        const sortedItems = [...items].sort(
          (left, right) => parseDate(right.date) - parseDate(left.date),
        );
        if (!sortedItems.length) {
          showMessage('No acquisition records are available.', 'empty');
          statusNode.textContent = 'No records';
          return;
        }

        const fragment = document.createDocumentFragment();
        sortedItems.forEach((item) => {
          const row = document.createElement('tr');
          appendTextCell(row, item.date, 'date');
          appendStateCell(row, item.initiatorState || 'other');
          appendTextCell(row, item.initiator, 'name');
          appendStateCell(row, item.acquiredState || 'other');
          appendTextCell(row, item.acquired, 'name');
          appendTextCell(row, item.price, 'price');
          appendLinkCell(row, item.officialInfo);
          fragment.append(row);
        });
        listNode.replaceChildren(fragment);
        statusNode.textContent = `${sortedItems.length} records`;
      };

      fetch('./data.json')
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((data) => {
          if (!Array.isArray(data.list)) throw new Error('Invalid data format');
          render(data.list);
        })
        .catch((error) => {
          console.error('Unable to load data.json:', error);
          showMessage('Unable to load data. Please open this page through an HTTP server.', 'error');
          statusNode.textContent = 'Failed to load data';
        });
    </script>
  </body>
</html>
